name: Tasques Diàries 01:00 AM (Correus + Preguntes)

on:
  schedule:
    # 00:00 UTC = 01:00 AM Europe/Madrid (hivern) / 02:00 AM (estiu)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install firebase-admin i nodemailer
        run: npm install --no-save firebase-admin nodemailer
      - name: Executar enviament de correus i generació de preguntes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FALLBACK_EMAIL: ${{ secrets.FALLBACK_EMAIL }}
          APP_BASE_URL: https://polsolerjofra-acna.github.io/AppBombers/
        run: node scripts/daily-automation.mjs
